CONFIG_GPIO=y
CONFIG_UART_CONSOLE=n
# LF clock source is set on the lfclk node in app.overlay; the RC calibration
# it used to need enabling for now defaults to y off that same property.

CONFIG_PWM=y

# From peripheral sample, reduced
CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DIS=y
CONFIG_BT_DEVICE_NAME="LILLABOBT"
CONFIG_BT_DEVICE_APPEARANCE=833

# Added from MSLED
CONFIG_BT_RX_STACK_SIZE=1024
CONFIG_BT_HCI_TX_STACK_SIZE_WITH_PROMPT=y
CONFIG_BT_HCI_TX_STACK_SIZE=640
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512
CONFIG_IDLE_STACK_SIZE=64
CONFIG_MAIN_STACK_SIZE=640
CONFIG_ISR_STACK_SIZE=640

# Drivers and peripherals
CONFIG_I2C=n
CONFIG_WATCHDOG=n
CONFIG_SPI=n
CONFIG_SERIAL=n
CONFIG_ADC=n
CONFIG_PINCTRL=y

# Memory protection
CONFIG_THREAD_STACK_INFO=n
CONFIG_THREAD_CUSTOM_DATA=n
CONFIG_FPU=n

# Build
CONFIG_SIZE_OPTIMIZATIONS=y

# ARM
CONFIG_ARM_MPU=n

# Power management
CONFIG_PM=n
 
# Interrupts
CONFIG_DYNAMIC_INTERRUPTS=n
CONFIG_IRQ_OFFLOAD=n

# Disable features not needed
CONFIG_TIMESLICING=n
CONFIG_ASSERT=y

# Disable Bluetooth features not needed
# CONFIG_BT_DEBUG_NONE=y
CONFIG_BT_ASSERT=n
CONFIG_BT_DATA_LEN_UPDATE=n
CONFIG_BT_PHY_UPDATE=n
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_GATT_SERVICE_CHANGED=n
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=n
# CONFIG_BT_HCI_VS_EXT=n

# Disable Bluetooth controller features not needed
CONFIG_BT_CTLR_PRIVACY=n
CONFIG_BT_CTLR_PHY_2M=n

# Reduce Bluetooth buffers
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=1
CONFIG_BT_BUF_EVT_DISCARDABLE_SIZE=45
# CONFIG_BT_BUF_ACL_RX_COUNT=2
CONFIG_BT_BUF_EVT_RX_COUNT=2

CONFIG_BT_L2CAP_TX_BUF_COUNT=2
CONFIG_BT_CTLR_RX_BUFFERS=1
CONFIG_BT_BUF_ACL_TX_COUNT=1
CONFIG_BT_BUF_ACL_TX_SIZE=27

# Crypto. The BT controller and host pull in PSA crypto (via mbedtls) whether
# we want it or not; the key slot table is statically sized, and 16 slots is
# far more than a single-connection peripheral uses. Matches the value in
# zephyr/samples/bluetooth/peripheral_hr/prj_minimal.conf.
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=5

# Logging, disable when not debugging
# CONFIG_CONSOLE=n
CONFIG_PRINTK=y
CONFIG_RTT_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=255
CONFIG_SEGGER_RTT_MAX_NUM_UP_BUFFERS=1
CONFIG_LOG=n

